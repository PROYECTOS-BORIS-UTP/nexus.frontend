name: Deploy Frontend (Dedicated Folder)

on:
  push:
    branches: [ "DESARROLLO" ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: [self-hosted, frontend]

    steps:
      # 1. Bajar código
      - name: Chequear código
        uses: actions/checkout@v4

      # 2. Configurar Node
      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 3. Build (En el Runner)
      - name: Instalar y Construir
        run: |
          npm ci
          npm run build -- --configuration production

      # 4. MOVER A RUTA DEDICADA (Súper Rápido en Frontend)
      - name: Publicar en C:\proyectos\NEXUS\nexus.frontend
        shell: powershell
        run: |
          # Definimos la ruta destino
          $dest = "C:\proyectos\NEXUS\nexus.frontend"

          # Si no existe, la creamos
          if (!(Test-Path -Path $dest)) {
              New-Item -ItemType Directory -Force -Path $dest | Out-Null
          }

          Write-Host "Copiando archivos compilados..."
          
          # Copiamos SOLO la carpeta 'dist'
          Copy-Item -Path "dist" -Destination $dest -Recurse -Force
          
          Write-Host "Archivos movidos correctamente a $dest"

      # 5. GESTIÓN PM2 (Desde la nueva ruta)
      - name: Desplegar con PM2 Serve
        shell: powershell
        env:
          # TRUCO: Evita que el runner mate el proceso
          RUNNER_TRACKING_ID: ""
        run: |
          # Definimos la ruta EXACTA donde Angular dejó el index.html
          # OJO: Angular 17+ suele crear dist/nombre-proyecto/browser
          $ServePath = "C:\proyectos\NEXUS\nexus.frontend\dist\nexus.frontend\browser"
          
          Write-Host "🚀 Sirviendo desde: $ServePath"

          # Aseguramos PM2
          npm install -g pm2

          # -- GESTIÓN DEL PROCESO --
          
          # 1. Verificamos si existe para borrarlo y recrearlo limpio
          $pm2List = pm2 list
          if ($pm2List -match "nexus-frontend") {
              Write-Host "🔄 Actualizando proceso existente..."
              pm2 delete nexus-frontend
          }

          # 2. Levantamos el servidor estático
          # --spa es vital para que Angular maneje las rutas
          pm2 serve $ServePath 4200 --spa --name "nexus-frontend"

          # 3. Guardar configuración
          pm2 save