<div class="table-container">
    <table mat-table [dataSource]="dataSource" matSort>

        <ng-content></ng-content>

        <ng-container matColumnDef="actions" *ngIf="actions.length > 0">
            <th mat-header-cell *matHeaderCellDef> Acciones </th>
            <td mat-cell *matCellDef="let element">
                <button mat-icon-button [matMenuTriggerFor]="menu">
                    <mat-icon>more_vert</mat-icon>
                </button>
                <mat-menu #menu="matMenu">
                    <button *ngFor="let action of actions" mat-menu-item (click)="onActionClick(action.name, element)">
                        <mat-icon>{{ action.icon }}</mat-icon>
                        <span>{{ action.label }}</span>
                    </button>
                </mat-menu>
            </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="internalDisplayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: internalDisplayedColumns;"></tr>

        <tr class="mat-row" *matNoDataRow>
            <td class="mat-cell" [attr.colspan]="internalDisplayedColumns.length">No se encontraron datos.</td>
        </tr>
    </table>
</div>

<mat-paginator
    [length]="totalRecords"
    [pageSize]="initialPageSize"
    [pageSizeOptions]="pageSizeOptions"
    showFirstLastButtons
    aria-label="Seleccionar página">
</mat-paginator>
