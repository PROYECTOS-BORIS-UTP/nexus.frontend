<div class="contacto-container">
    <div class="header">
        <h2 mat-dialog-title>Contactos de {{ cliente.vRazonSocial }}</h2>
        <button mat-icon-button (click)="onClose()">
            <mat-icon>close</mat-icon>
        </button>
    </div>

    <mat-dialog-content>
        <div class="controls-container">
            <mat-form-field appearance="outline" class="search-field">
                <mat-label>Buscar Contacto</mat-label>
                <input matInput (input)="applyFilter($event)" placeholder="Escribe Nombre..." #inputFilter>
                <mat-icon matSuffix>search</mat-icon>
            </mat-form-field>

            <button mat-raised-button color="primary" (click)="onAddContacto()" class="btnAgregar">
                <mat-icon>add</mat-icon>
                <span>Agregar Contacto</span>
            </button>
        </div>

        @if (isLoading()) {
        <mat-progress-bar mode="indeterminate"></mat-progress-bar>
        }

        <div class="table-container">
            <app-table-generic #table [data]="data()" [displayedColumns]="aDisplayedColumns" [selection]="selection"
                [actions]="contactoActions" [totalRecords]="totalRecords()" [pageSizeOptions]="pageSizeOptions"
                [initialPageSize]="currentPageSize" (actionClicked)="onActionClicked($event)"
                (pageChange)="handlePageEvent($event)">

                <ng-container matColumnDef="select">
                    <th mat-header-cell *matHeaderCellDef>
                        <mat-checkbox (change)="$event ? toggleAllRows() : null"
                            [checked]="selection.hasValue() && isAllSelected()"
                            [indeterminate]="selection.hasValue() && !isAllSelected()"
                            aria-label="Seleccionar todas las filas">
                        </mat-checkbox>
                    </th>
                    <td mat-cell *matCellDef="let row">
                        <mat-checkbox (click)="$event.stopPropagation()"
                            (change)="$event ? selection.toggle(row) : null" [checked]="selection.isSelected(row)"
                            [aria-label]="'Seleccionar contacto ' + row.vNombreCompleto">
                        </mat-checkbox>
                    </td>
                </ng-container>

                <ng-container matColumnDef="vNombreCompleto">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header> Nombre Completo </th>
                    <td mat-cell *matCellDef="let element"> {{element.vNombreCompleto}} </td>
                </ng-container>

                <ng-container matColumnDef="vCargo">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header> Cargo </th>
                    <td mat-cell *matCellDef="let element"> {{element.vCargo || '-'}} </td>
                </ng-container>

                <ng-container matColumnDef="vCelular">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header> Celular </th>
                    <td mat-cell *matCellDef="let element"> {{element.vCelular || '-'}} </td>
                </ng-container>

                <ng-container matColumnDef="vCorreo">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header> Correo </th>
                    <td mat-cell *matCellDef="let element"> {{element.vCorreo}} </td>
                </ng-container>

                <ng-container matColumnDef="bEsPrincipal">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header> Es Principal </th>
                    <td mat-cell *matCellDef="let element">
                        @if(element.bEsPrincipal) {
                        <mat-chip highlighted color="accent">Principal</mat-chip>
                        }
                    </td>
                </ng-container>

                <ng-container matColumnDef="bActivo">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header> Estado </th>
                    <td mat-cell *matCellDef="let element">
                        <app-estado-general [iIdEstado]="element.bActivo ? 1 : 2"
                            [vNombreEstado]="element.bActivo ? 'Activo' : 'Inactivo'">
                        </app-estado-general>
                    </td>
                </ng-container>

            </app-table-generic>
        </div>
    </mat-dialog-content>
</div>
