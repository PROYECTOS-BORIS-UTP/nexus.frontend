<h1 mat-dialog-title>{{ titulo }}</h1>

<div mat-dialog-content [formGroup]="PersonaForm">
    <mat-form-field appearance="outline" class="w-full">
        <mat-label>Nombre Completo de la persona</mat-label>
        <input matInput formControlName="vCodigo" placeholder="Ingrese el codigo">
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-full mt-4">
        <mat-label>DNI</mat-label>
        <input matInput formControlName="vRUC" placeholder="Ingrese la RUC">
    </mat-form-field>

</div>

<div mat-dialog-actions align="end">
    <button mat-button (click)="onCancelar()">Cancelar</button>
    <button mat-raised-button color="primary" (click)="onGuardar()" [disabled]="!PersonaForm.valid">
        {{ isEditMode ? 'Actualizar' : 'Guardar' }}
    </button>
</div>
