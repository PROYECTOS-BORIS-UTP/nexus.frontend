
<div class="page-container">
  <div class="controls-container">
    <mat-form-field appearance="outline" class="search-field">
      <mat-label>Buscar Compañía</mat-label>
      <input
        matInput
        (keyup)="table.applyFilter($event)"
        placeholder="Buscar por DNI o Nombre completos"
        aria-label="Campo de búsqueda de persona"
      />
      <mat-icon matSuffix>search</mat-icon>
    </mat-form-field>

    <div class="actions-container">
      <button mat-raised-button color="primary" (click)="onAddPersona()" class="btn-agregar">
        <mat-icon>add</mat-icon>
        <span>Agregar Persona</span>
      </button>
    </div>
  </div>

  <app-table-generic
    #table
    [data]="data"
    [displayedColumns]="aDisplayedColumns"
    [selection]="selection"
    [actions]="personaActions"
    (actionClicked)="onActionClicked($event)"
  >
    <ng-container matColumnDef="select">
      <th mat-header-cell *matHeaderCellDef>
        <mat-checkbox
          (change)="$event ? toggleAllRows() : null"
          [checked]="selection.hasValue() && isAllSelected()"
        >
        </mat-checkbox>
      </th>
      <td mat-cell *matCellDef="let row">
        <mat-checkbox
          (click)="$event.stopPropagation()"
          (change)="$event ? selection.toggle(row) : null"
          [checked]="selection.isSelected(row)"
        >
        </mat-checkbox>
      </td>
    </ng-container>

    <ng-container matColumnDef="nombrecompleto">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Nombre Completo </th>
      <td mat-cell *matCellDef="let element">{{ element.vNombreCompleto }}</td>
    </ng-container>

    <ng-container matColumnDef="dni">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>DNI</th>
      <td mat-cell *matCellDef="let element">{{ element.vDNI }}</td>
    </ng-container>

    <ng-container matColumnDef="fechaNacimiento">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Fecha De Nacimiento</th>
      <td mat-cell *matCellDef="let element">{{ element.dFechaNacimiento | date:'dd/MM/yyyy' }}</td>
    </ng-container>

    <ng-container matColumnDef="correo">
      <th mat-header-cell *matHeaderCellDef>Correo</th>
      <td mat-cell *matCellDef="let element">{{ element.vCorreo }}</td>
    </ng-container>

    <ng-container matColumnDef="celular">
      <th mat-header-cell *matHeaderCellDef>Celular</th>
      <td mat-cell *matCellDef="let element">{{ element.vCelular1 }}</td>
    </ng-container>

    <ng-container matColumnDef="estado">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Estado</th>
      <td mat-cell *matCellDef="let element" class="estado-cell">
        <app-estado-persona
          [iIdEstado]="element.bActivo.iIdEstado"
          [vNombreEstado]="element.bActivo.vNombreEstado"
        >
        </app-estado-persona>
      </td>
    </ng-container>
  </app-table-generic>
</div>
