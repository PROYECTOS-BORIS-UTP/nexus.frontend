<div class="page-container">
	<div class="controls-container">
		<mat-form-field appearance="outline" class="search-field">
			<mat-label>Buscar Persona</mat-label>
			<input matInput (input)="applyFilter($event)" placeholder="Escribe nombre, DNI o RUC..." #inputFilter>
			<mat-icon matSuffix>search</mat-icon>
		</mat-form-field>

		<div class="actions-container">
			<button mat-raised-button color="primary" (click)="onAddPersona()" class="btnAgregar">
				<mat-icon>add</mat-icon>
				<span>Agregar Persona</span>
			</button>
		</div>
	</div>

	@if (isLoading()) {
		<mat-progress-bar mode="indeterminate"></mat-progress-bar>
	}

	<app-table-generic #table [data]="data()" [displayedColumns]="aDisplayedColumns" [selection]="selection"
		[actions]="personaActions" [totalRecords]="totalRecords()" [pageSizeOptions]="pageSizeOptions"
		[initialPageSize]="currentPageSize" (actionClicked)="onActionClicked($event)"
		(pageChange)="handlePageEvent($event)">

		<ng-container matColumnDef="select">
			<th mat-header-cell *matHeaderCellDef>
				<mat-checkbox (change)="$event ? toggleAllRows() : null"
					[checked]="selection.hasValue() && isAllSelected()"
					[indeterminate]="selection.hasValue() && !isAllSelected()" aria-label="Seleccionar todas las filas">
				</mat-checkbox>
			</th>
			<td mat-cell *matCellDef="let row">
				<mat-checkbox (click)="$event.stopPropagation()" (change)="$event ? selection.toggle(row) : null"
					[checked]="selection.isSelected(row)" [aria-label]="'Seleccionar persona ' + row.vNombreCompleto">
				</mat-checkbox>
			</td>
		</ng-container>

		<ng-container matColumnDef="vNombreCompleto">
			<th mat-header-cell *matHeaderCellDef mat-sort-header> Nombre Completo </th>
			<td mat-cell *matCellDef="let element"> {{element.vNombreCompleto}} </td>
		</ng-container>

		<ng-container matColumnDef="vDNI">
			<th mat-header-cell *matHeaderCellDef mat-sort-header> DNI </th>
			<td mat-cell *matCellDef="let element"> {{element.vDNI || '-'}} </td>
		</ng-container>

		<ng-container matColumnDef="vRUC">
			<th mat-header-cell *matHeaderCellDef mat-sort-header> RUC </th>
			<td mat-cell *matCellDef="let element"> {{element.vRUC || '-'}} </td>
		</ng-container>

		<ng-container matColumnDef="vCorreo">
			<th mat-header-cell *matHeaderCellDef mat-sort-header> Correo </th>
			<td mat-cell *matCellDef="let element" [matTooltip]="element.vCorreo">
				{{ element.vCorreo || '-' }}
			</td>
		</ng-container>

		<ng-container matColumnDef="vCelular1">
			<th mat-header-cell *matHeaderCellDef mat-sort-header> Celular </th>
			<td mat-cell *matCellDef="let element"> {{element.vCelular1 || '-'}} </td>
		</ng-container>

		<ng-container matColumnDef="bActivo">
			<th mat-header-cell *matHeaderCellDef mat-sort-header> Estado </th>
			<td mat-cell *matCellDef="let element">
				<app-estado-general [iIdEstado]="element.bActivo ? 1 : 2"
					[vNombreEstado]="element.bActivo ? 'Activo' : 'Inactivo'">
				</app-estado-general>
			</td>
		</ng-container>

	</app-table-generic>

</div>
