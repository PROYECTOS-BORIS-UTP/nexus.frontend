<div class="page-container">
    <div class="controls-container">
        <mat-form-field appearance="outline" class="search-field">
            <input matInput (keyup)="applyFilter($event)" placeholder="Buscar Usuario">
        </mat-form-field>
    </div>

    <div class="table-container">
        <table mat-table [dataSource]="oDataSource" matSort>

            <ng-container matColumnDef="select">
                <th mat-header-cell *matHeaderCellDef>
                    <mat-checkbox
                        (change)="$event ? toggleAllRows() : null"
                        [checked]="oSelection.hasValue() && isAllSelected()">
                    </mat-checkbox>
                </th>
                <td mat-cell *matCellDef="let row">
                    <mat-checkbox
                        (click)="$event.stopPropagation()"
                        (change)="$event ? oSelection.toggle(row) : null"
                        [checked]="oSelection.isSelected(row)">
                    </mat-checkbox>
                </td>
            </ng-container>

            <ng-container matColumnDef="nombre">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> Nombre </th>
                <td mat-cell *matCellDef="let element"> {{element.vNombreCompleto}} </td>
            </ng-container>

            <ng-container matColumnDef="email">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> Email </th>
                <td mat-cell *matCellDef="let element"> {{element.vEmail}} </td>
            </ng-container>

            <ng-container matColumnDef="fechaCreacion">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> Miembro desde </th>
                <td mat-cell *matCellDef="let element"> {{element.dFechaCreacion}} </td>
            </ng-container>

            <ng-container matColumnDef="perfil">
                <th mat-header-cell *matHeaderCellDef> Perfiles </th>
                <td mat-cell *matCellDef="let element">
                    <div class="perfiles-container">
                        <app-perfil-usuario *ngFor="let perfil of element.aPerfiles" [oPerfil]="perfil">
                        </app-perfil-usuario>
                    </div>
                </td>
            </ng-container>

            <ng-container matColumnDef="estado">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> Estado </th>
                <td mat-cell *matCellDef="let element">
                    <app-estado-usuario 
                        [iIdEstado]="element.oEstado.iIdEstado" 
                        [vNombreEstado]="element.oEstado.vNombreEstado">
                    </app-estado-usuario>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="aDisplayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: aDisplayedColumns;"></tr>

            <tr class="mat-row" *matNoDataRow>
                <td class="mat-cell" colspan="7">No se encontraron datos.</td>
            </tr>
        </table>
    </div>

    <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons></mat-paginator>
</div>
