<div class="page-container">
    <div class="controls-container">
        <mat-form-field appearance="outline" class="search-field">
            <input matInput (keyup)="table.applyFilter($event)" placeholder="Buscar Perfil">
        </mat-form-field>
    </div>

    <app-table-generic #table [data]="data" [displayedColumns]="aDisplayedColumns" [selection]="selection"
        [actions]="profileActions" (actionClicked)="onActionClicked($event)">

        <ng-container matColumnDef="select">
            <th mat-header-cell *matHeaderCellDef>
                <mat-checkbox (change)="$event ? toggleAllRows() : null"
                    [checked]="selection.hasValue() && isAllSelected()">
                </mat-checkbox>
            </th>
            <td mat-cell *matCellDef="let row">
                <mat-checkbox (click)="$event.stopPropagation()" (change)="$event ? selection.toggle(row) : null"
                    [checked]="selection.isSelected(row)">
                </mat-checkbox>
            </td>
        </ng-container>

        <ng-container matColumnDef="iniciales">
            <th mat-header-cell *matHeaderCellDef> Iniciales </th>
            <td mat-cell *matCellDef="let element">
                <div class="perfil-avatar" [style.background-color]="element.vColorPerfil">
                    {{ element.vInicialesPerfil }}
                </div>
            </td>
        </ng-container>

        <ng-container matColumnDef="nombre">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Nombre del Perfil </th>
            <td mat-cell *matCellDef="let element"> {{element.vNombrePerfil}} </td>
        </ng-container>

        <ng-container matColumnDef="id">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> ID </th>
            <td mat-cell *matCellDef="let element"> {{element.iIdPerfil}} </td>
        </ng-container>

    </app-table-generic>
</div>
