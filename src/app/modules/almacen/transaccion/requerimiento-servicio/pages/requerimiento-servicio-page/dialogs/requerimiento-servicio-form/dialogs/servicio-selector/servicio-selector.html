<h2 mat-dialog-title>Seleccionar Servicios</h2>

<mat-dialog-content class="dialog-content">
    <div class="filter-container">
        <mat-form-field appearance="outline" class="search-field">
            <mat-label>Buscar Servicio</mat-label>
            <input matInput (input)="applyFilter($event)" placeholder="Nombre del servicio...">
            <mat-icon matSuffix>search</mat-icon>
        </mat-form-field>
    </div>

    @if (isLoading()) {
    <mat-progress-bar mode="indeterminate"></mat-progress-bar>
    }

    <div class="table-container">
        <app-table-generic [data]="data()" [displayedColumns]="displayedColumns" [totalRecords]="totalRecords()"
            [pageSizeOptions]="pageSizeOptions" [initialPageSize]="currentPageSize"
            (pageChange)="handlePageEvent($event)">

            <!-- Checkbox Column -->
            <ng-container matColumnDef="select">
                <th mat-header-cell *matHeaderCellDef>
                    <mat-checkbox (change)="$event ? toggleAllRows() : null"
                        [checked]="selection.hasValue() && isAllSelected()"
                        [indeterminate]="selection.hasValue() && !isAllSelected()">
                    </mat-checkbox>
                </th>
                <td mat-cell *matCellDef="let row">
                    <mat-checkbox (click)="$event.stopPropagation()" (change)="$event ? selection.toggle(row) : null"
                        [checked]="selection.isSelected(row)">
                    </mat-checkbox>
                </td>
            </ng-container>

            <!-- Titulo Column -->
            <ng-container matColumnDef="vTitulo">
                <th mat-header-cell *matHeaderCellDef> Título </th>
                <td mat-cell *matCellDef="let element"> {{element.vTitulo}} </td>
            </ng-container>

            <!-- Descripcion Column -->
            <ng-container matColumnDef="vDescripcion">
                <th mat-header-cell *matHeaderCellDef> Descripción </th>
                <td mat-cell *matCellDef="let element"> {{element.vDescripcion}} </td>
            </ng-container>

        </app-table-generic>
    </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
    <button mat-button (click)="onCancel()">Cancelar</button>
    <button mat-raised-button color="primary" (click)="onConfirm()" [disabled]="selection.selected.length === 0">
        Agregar ({{selection.selected.length}})
    </button>
</mat-dialog-actions>
