<div class="sidebar-container">
    <div class="logo-wrapper">
        <img src="./assets/img/isotipo.png" alt="Nexus Logo" />
    </div>

    <mat-nav-list>
        @for (item of menuItems$ | async; track item.iIdOpcion; let i = $index) {
            <app-menu-item
                [item]="item"
                [isActive]="isSubmenuOpen && selectedMenu?.iIdOpcion === item.iIdOpcion"
                (itemClick)="toggleSubmenu(item)"
                [class]="'item-' + i">
            </app-menu-item>
        }
    </mat-nav-list>

    <div class="btnLogout">
        <button matButton (click)="abrirDialogoLogout()"><mat-icon>exit_to_app</mat-icon></button>
    </div>
</div>

<div class="submenu-panel" [class.open]="isSubmenuOpen" #submenuPanel>
    @if (selectedMenu && selectedMenu.children) {
        <h3 class="submenu-title" [style.background-color]="selectedMenu.vColor">
            {{ selectedMenu.vTooltip }}
        </h3>
        <mat-divider></mat-divider>
        
        <app-submenu-item 
            [items]="selectedMenu.children"
            (linkClicked)="closeSubmenu()">
        </app-submenu-item>
    }
</div>
